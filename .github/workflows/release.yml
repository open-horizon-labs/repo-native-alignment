name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  # M4-optimized build first — warms sccache for M1 baseline
  build-fast:
    runs-on: namespace-profile-tahoe
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$OSTYPE" == darwin* ]]; then
            sed -i '' 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
            sed -i '' 's/"version": "[^"]*"/"version": "'"$VERSION"'"/g' .claude-plugin/marketplace.json
          else
            sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
            sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/g' .claude-plugin/marketplace.json
          fi

      - name: Install protoc
        run: bash .github/scripts/install-protoc.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Namespace sccache cache
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin
        env:
          RUSTFLAGS: "-C target-cpu=apple-m4 -C link-arg=-Wl,-dead_strip"
          RUSTC_WRAPPER: sccache

      - name: Strip and compress binary
        run: |
          strip target/aarch64-apple-darwin/release/repo-native-alignment
          tar czf repo-native-alignment-darwin-arm64-fast.tar.gz -C target/aarch64-apple-darwin/release repo-native-alignment

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: repo-native-alignment-darwin-arm64-fast
          path: repo-native-alignment-darwin-arm64-fast.tar.gz

  # M1 baseline after M4 (shares sccache for same target triple)
  build-m1:
    needs: build-fast
    runs-on: namespace-profile-tahoe
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Patch version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$OSTYPE" == darwin* ]]; then
            sed -i '' 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
            sed -i '' 's/"version": "[^"]*"/"version": "'"$VERSION"'"/g' .claude-plugin/marketplace.json
          else
            sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
            sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/g' .claude-plugin/marketplace.json
          fi
      - name: Install protoc
        run: bash .github/scripts/install-protoc.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Configure Namespace sccache cache
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"
      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1 -C link-arg=-Wl,-dead_strip"
          RUSTC_WRAPPER: sccache
      - name: Strip and compress binary
        run: |
          strip target/aarch64-apple-darwin/release/repo-native-alignment
          tar czf repo-native-alignment-darwin-arm64.tar.gz -C target/aarch64-apple-darwin/release repo-native-alignment
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: repo-native-alignment-darwin-arm64
          path: repo-native-alignment-darwin-arm64.tar.gz

  # Linux builds in parallel with M4 (no shared cache across architectures)
  build-linux:
    runs-on: namespace-profile-cached
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Patch version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/g' .claude-plugin/marketplace.json
      - name: Install protoc
        run: bash .github/scripts/install-protoc.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Configure Namespace sccache cache
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"
      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --no-default-features
        env:
          RUSTC_WRAPPER: sccache
      - name: Strip and compress binary
        run: |
          strip target/x86_64-unknown-linux-gnu/release/repo-native-alignment
          tar czf repo-native-alignment-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release repo-native-alignment
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: repo-native-alignment-linux-x86_64
          path: repo-native-alignment-linux-x86_64.tar.gz

  release:
    needs: [build-fast, build-m1, build-linux]
    runs-on: namespace-profile-cached

    steps:
      - name: Checkout (for tag annotation)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ASSETS=(
            repo-native-alignment-darwin-arm64/repo-native-alignment-darwin-arm64.tar.gz
            repo-native-alignment-darwin-arm64-fast/repo-native-alignment-darwin-arm64-fast.tar.gz
            repo-native-alignment-linux-x86_64/repo-native-alignment-linux-x86_64.tar.gz
          )

          # If release already exists (e.g. created manually with notes), just upload artifacts
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG exists — uploading artifacts"
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${ASSETS[@]}"
          else
            # Create new release with auto-generated notes
            NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")
            if [ -n "$NOTES" ]; then
              gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "$NOTES" "${ASSETS[@]}"
            else
              gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes "${ASSETS[@]}"
            fi
          fi

  bump-source:
    needs: release
    runs-on: namespace-profile-cached

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Patch version in source
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/g' .claude-plugin/marketplace.json

          # Cargo.lock records this workspace member's own version. Bumping
          # Cargo.toml without it leaves main failing every `--locked` command,
          # which is how v0.3.0 shipped a stale lock.
          #
          # Patched with awk rather than cargo, deliberately. This job installs
          # no Rust toolchain, and adding one would not be enough: `cargo update
          # --workspace --offline` cannot resolve the metal-candle git
          # dependency on a cold cache, and this job has none. A non-workspace
          # dependency would need a full network resolve. The only line that
          # must change is the member's own version, inside its own
          # [[package]] block, so patch exactly that.
          # `in_block` arms only inside a [[package]] table, so a same-named
          # entry under [[patch.unused]] or any other array-of-tables is left
          # alone.
          awk -v version="$VERSION" '
            /^\[\[/ { in_block = ($0 == "[[package]]"); in_pkg = 0 }
            in_block && /^name = "repo-native-alignment"$/ { in_pkg = 1 }
            in_pkg && /^version = / { print "version = \"" version "\""; in_pkg = 0; next }
            { print }
          ' Cargo.lock > Cargo.lock.bumped
          mv Cargo.lock.bumped Cargo.lock

          # Assert every patched file. Fail loudly rather than open a PR that
          # silently leaves one of them stale: this job's own checks are the
          # only gate that will ever run, because a PR opened by
          # create-pull-request with GITHUB_TOKEN cannot trigger workflows, so
          # the bump PR receives no Rust CI before it auto-merges.
          #
          # -F because a version string contains dots, which are regex
          # wildcards to plain grep.
          grep -A1 '^name = "repo-native-alignment"$' Cargo.lock \
            | grep -qxF "version = \"$VERSION\"" \
            || { echo "::error::Cargo.lock version patch did not apply"; exit 1; }
          grep -qxF "version = \"$VERSION\"" Cargo.toml \
            || { echo "::error::Cargo.toml version patch did not apply"; exit 1; }
          # marketplace.json carries the riskiest edit of the three: the sed is
          # unanchored and global, rewriting every "version" key in the file.
          # Assert no other value survived.
          test "$(grep -c "\"version\": \"$VERSION\"" .claude-plugin/marketplace.json)" \
             = "$(grep -c '"version":' .claude-plugin/marketplace.json)" \
            || { echo "::error::marketplace.json version patch incomplete"; exit 1; }

      - name: Create version bump PR
        id: bump-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ github.ref_name }}"
          title: "chore: bump version to ${{ github.ref_name }}"
          body: "Auto-generated by release workflow after tagging ${{ github.ref_name }}."
          branch: chore/bump-${{ github.ref_name }}
          base: main
          add-paths: |
            Cargo.toml
            Cargo.lock
            .claude-plugin/marketplace.json

      - name: Enable auto-merge
        if: steps.bump-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.bump-pr.outputs.pull-request-number }} --squash --auto
