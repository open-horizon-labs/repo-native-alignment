name: Rust CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: namespace-profile-cached
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'build.rs'
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.github/fixtures/**'
              - 'security/rustsec-policy.json'

  audit:
    needs: changes
    runs-on: namespace-profile-cached
    timeout-minutes: 15
    steps:
      - name: Skip (no Rust changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes — skipping RustSec audit"
      - name: Checkout
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Cargo downloads
        if: needs.changes.outputs.rust == 'true'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
      - name: Install pinned cargo-audit
        if: needs.changes.outputs.rust == 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Prove RustSec policy decisions
        if: needs.changes.outputs.rust == 'true'
        run: python3 .github/scripts/check-rustsec-policy.py --self-test
      - name: Audit authoritative lockfile
        if: needs.changes.outputs.rust == 'true'
        run: python3 .github/scripts/check-rustsec-policy.py --live

  lint:
    needs: changes
    runs-on: namespace-profile-cached
    timeout-minutes: 15
    steps:
      - name: Skip (no Rust changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes — skipping lint"
      - name: Checkout
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v5
      - name: Rust workflow pins agree
        if: needs.changes.outputs.rust == 'true'
        run: bash .github/scripts/check-rust-toolchain-pins.sh
      - name: No language-specific conditionals in generic.rs
        if: needs.changes.outputs.rust == 'true'
        run: |
          if grep -n 'language_name ==' src/extract/generic.rs; then
            echo "FAIL: language-specific logic in generic.rs — use LangConfig fields"
            exit 1
          fi
      - name: No linear scans on graph node/edge collections (warn)
        if: needs.changes.outputs.rust == 'true'
        run: |
          HITS=$(grep -rn 'graph_state\.nodes\.iter()\.find(\|gs\.nodes\.iter()\.find(' src/service.rs src/server/helpers.rs || true)
          if [ -n "$HITS" ]; then
            echo "WARN: nodes.iter().find() in production code — consider HashMap lookup"
            echo "$HITS"
          fi
      - name: No unnecessary clones of large collections
        if: needs.changes.outputs.rust == 'true'
        run: |
          HITS=$(grep -rn '\.nodes\.clone()\|\.edges\.clone()' src/ --include='*.rs' | grep -v '#\[test\]' | grep -v '_test' || true)
          if [ -n "$HITS" ]; then
            echo "WARN: cloning nodes/edges vec — can you move instead?"
            echo "$HITS"
          fi
      - name: Install protoc
        if: needs.changes.outputs.rust == 'true'
        run: bash .github/scripts/install-protoc.sh
      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Setup sccache
        if: needs.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Configure Namespace sccache cache
        if: needs.changes.outputs.rust == 'true'
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"
      - name: Cache Rust downloads
        if: needs.changes.outputs.rust == 'true'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTC_WRAPPER: "sccache"
        run: cargo clippy --no-default-features -- -D warnings

  test:
    needs: changes
    runs-on: namespace-profile-cached
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Skip (no Rust changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes — skipping tests"
      - name: Checkout
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v5

      - name: Install protoc
        if: needs.changes.outputs.rust == 'true'
        run: bash .github/scripts/install-protoc.sh

      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Setup sccache
        if: needs.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Namespace sccache cache
        if: needs.changes.outputs.rust == 'true'
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Cache Rust downloads
        if: needs.changes.outputs.rust == 'true'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git

      - name: Run all tests (test profile, no debuginfo)
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTC_WRAPPER: "sccache"
        run: cargo test --no-default-features

  smoke:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: namespace-profile-cached
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protoc
        run: bash .github/scripts/install-protoc.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Namespace sccache cache
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Cache Rust downloads
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git

      - name: Build release binary
        env:
          RUSTC_WRAPPER: "sccache"
        run: cargo build --release --no-default-features

      - name: RNA pipeline smoke test (rna test)
        run: ./target/release/repo-native-alignment test --repo .github/fixtures/smoke
        timeout-minutes: 2

      - name: Build index for CLI smoke tests
        run: ./target/release/repo-native-alignment scan --path .github/fixtures/smoke
        timeout-minutes: 1

      - name: CLI search smoke test
        run: |
          OUTPUT=$(./target/release/repo-native-alignment search "hello" --repo .github/fixtures/smoke --limit 3 2>/dev/null)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Code symbols" || { echo "FAIL: search returned no results"; exit 1; }

      - name: CLI graph smoke test
        run: |
          NODE_ID=$(./target/release/repo-native-alignment search "hello" --repo .github/fixtures/smoke --limit 1 2>/dev/null | grep "ID:" | head -1 | sed 's/.*`\(.*\)`.*/\1/')
          echo "Node: $NODE_ID"
          OUTPUT=$(./target/release/repo-native-alignment graph --node "$NODE_ID" --mode neighbors --repo .github/fixtures/smoke 2>/dev/null)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "neighbors\|No results" || { echo "FAIL: graph returned unexpected output"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MCP TypeScript SDK
        run: npm install --no-save @modelcontextprotocol/sdk

      - name: MCP stdio smoke test
        run: node .github/scripts/mcp-smoke.mjs ./target/release/repo-native-alignment .github/fixtures/smoke

  # M4-optimized build runs first (this is what developers install).
  # Warms sccache for the M1 baseline build that follows.
  build-release-fast:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: namespace-profile-tahoe
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protoc
        run: bash .github/scripts/install-protoc.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Namespace sccache cache
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Build optimized release binary
        run: cargo build --release --target aarch64-apple-darwin
        env:
          RUSTFLAGS: "-C target-cpu=apple-m4 -C link-arg=-Wl,-dead_strip"
          RUSTC_WRAPPER: sccache

      - name: Strip and compress binary
        run: |
          strip target/aarch64-apple-darwin/release/repo-native-alignment
          tar czf repo-native-alignment-darwin-arm64-fast.tar.gz -C target/aarch64-apple-darwin/release repo-native-alignment

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: repo-native-alignment-darwin-arm64-fast
          path: repo-native-alignment-darwin-arm64-fast.tar.gz
          retention-days: 30
